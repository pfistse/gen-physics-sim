_target_: models.cd.ConsistencyDistillationModel
_recursive_: false

defaults:
  - edm@pretrained_config
  - _self_

# Data Params
dim: ${data.dim}
ctx_len: ${data.ctx_len}
sim_fields: ${data.sim_fields}
sim_params: ${data.sim_params}

# Model Specific Hyperparams
ckpt_path: "/home/spfister/gen-physics-sim-wc/checkpoints/edm/e661/last-ema.ckpt"
ema_rate: 0.999
num_student_steps: 100

# Network
net:
  _target_: models.components.unet.UNetWrapper
  in_channels: ${mul:${data.num_channels},${add:${data.ctx_len},1}}
  out_channels: ${data.num_channels}
  # out_channels: ${mul:${data.num_channels},${add:${data.ctx_len},1}}

  hid_channels: 64
  ch_multipliers: [1, 2, 2, 2]
  num_res_blocks: 2
  apply_attn: [false, true, false, false]
  drop_rate: 0.0
  resample_with_conv: true

# Optimizer
lr: 1e-4
weight_decay: 0.0

# Evaluation/Inference
num_steps_eval: 1
eval_config: ${evaluation}
